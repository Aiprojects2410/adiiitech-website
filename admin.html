<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel — Adiiitech_</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

  <!-- ═══ LOGIN SCREEN ═══ -->
  <div id="login-screen">
    <div class="login-particles" id="login-particles"></div>
    <div class="login-box">
      <div class="login-logo"><span class="lb">[</span>ADIIITECH_<span class="lb">]</span></div>
      <div class="login-tag">// ADMIN ACCESS TERMINAL</div>
      <div class="login-form">
        <div class="field-group">
          <label class="field-label">ADMIN LOGIN ID (EMAIL)</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input type="email" id="email-input" class="field-input" placeholder="Enter your admin email" autocomplete="username" />
          </div>
        </div>
        <div class="field-group">
          <label class="field-label">ACCESS PASSWORD</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            <input type="password" id="password-input" class="field-input" placeholder="Enter your password" autocomplete="current-password" />
            <button type="button" id="toggle-pw-btn" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);background:none;border:none;cursor:pointer;padding:4px;" title="Show/Hide password">
              <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="login-error hidden" id="login-error">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span id="login-error-text">Invalid Login ID or Password.</span>
        </div>
        <button class="btn-login" id="login-btn">
          <span>ACCESS PANEL</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- ═══ ADMIN APP ═══ -->
  <div id="admin-app" class="hidden">

    <!-- MOBILE HAMBURGER -->
    <button class="adm-hamburger" id="adm-hamburger" aria-label="Toggle sidebar">
      <span></span><span></span><span></span>
    </button>

    <!-- SIDEBAR -->
    <aside id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-logo"><span class="lb">[</span>AT_<span class="lb">]</span></span>
        <div class="brand-info">
          <span class="brand-name">Adiiitech_</span>
          <span class="brand-role">Admin Panel</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item active" data-section="dashboard" id="nav-dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Dashboard</span></button>
        <button class="nav-item" data-section="brands" id="nav-brands"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><line x1="9" y1="10" x2="15" y2="10"/></svg><span>Brand Collabs</span><span class="nav-count-badge" id="brand-count-badge" style="display:none">0</span></button>
        <button class="nav-item" data-section="apps" id="nav-apps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/><path d="M9 6h6M9 10h6M9 14h4"/></svg><span>Apps Manager</span></button>
        <button class="nav-item" data-section="tips" id="nav-tips"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2a7 7 0 017 7c0 2.38-1.19 4.47-3 5.74V17a1 1 0 01-1 1H9a1 1 0 01-1-1v-2.26C6.19 13.47 5 11.38 5 9a7 7 0 017-7z"/><path d="M9 21h6M10 17v1M14 17v1"/></svg><span>Tips &amp; Tricks</span></button>
        <button class="nav-item" data-section="resources" id="nav-resources"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg><span>Resources</span></button>
        <button class="nav-item" data-section="social" id="nav-social"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg><span>Social Links</span></button>
        <button class="nav-item" data-section="settings" id="nav-settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93l-1.41 1.41M5.34 5.34L3.93 3.93M19.07 19.07l-1.41-1.41M5.34 18.66l1.41 1.41M22 12h-2M4 12H2M12 22v-2M12 4V2"/></svg><span>Settings</span></button>
      </nav>

      <div class="sidebar-footer">
        <a href="index.html" target="_blank" class="btn-view-site" id="view-site-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15,3 21,3 21,9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>View Live Site</a>
        <button id="logout-btn" class="btn-logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Logout</button>
      </div>
    </aside>
    <div id="sidebar-overlay"></div>
    <main id="admin-main"><div id="section-content"></div></main>
  </div>

  <div id="modal-overlay" class="hidden"><div id="modal-box"><div class="modal-header"><h3 id="modal-title">Add Item</h3><button id="modal-close" class="modal-close-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div><div id="modal-body"></div><div class="modal-actions"><button class="btn-cancel" id="modal-cancel">Cancel</button><button class="btn-save" id="modal-save">Save Changes</button></div></div></div>
  <div id="confirm-overlay" class="hidden"><div id="confirm-box"><div class="confirm-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#ff3a3a" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div><h3 id="confirm-title">Delete Item?</h3><p id="confirm-msg">This action cannot be undone.</p><div class="confirm-actions"><button class="btn-cancel" id="confirm-cancel">Cancel</button><button class="btn-delete" id="confirm-ok">Delete</button></div></div></div>
  <div id="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="admin.js"></script>
  <script src="admin-fix.js"></script>
</body>
</html>
